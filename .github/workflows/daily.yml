name: daily

on:
  schedule:
    - cron: "45 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: npm ci
      - name: install the valuation runtime
        run: pip install -r model/requirements.txt
      - name: cache the HumbleWorth weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/premium-domains/humbleworth-price-predict-v1
          key: humbleworth-price-predict-v1-a925db84-4d8953c6
      - name: cache valuations from the last 7 days
        uses: actions/cache@v4
        with:
          path: results/cache.json
          key: valuation-cache-${{ github.run_id }}
          restore-keys: |
            valuation-cache-
      - name: warm the valuation model
        run: python3 model/humbleworth/value.py --warm
      - name: scan
        run: npx tsx src/cli.ts scan --json --max-values 550000 --cache-days 7 --out results --state results/state.json --cache results/cache.json
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          DROPCATCH_CLIENT_ID: ${{ secrets.DROPCATCH_CLIENT_ID }}
          DROPCATCH_CLIENT_SECRET: ${{ secrets.DROPCATCH_CLIENT_SECRET }}
          AFTERNIC_FEED_URL: ${{ secrets.AFTERNIC_FEED_URL }}
      - name: publish the results file
        if: success()
        run: npx tsx scripts/publish-results.ts results/web-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-domains-results
          path: results
          if-no-files-found: warn
      - name: commit the list
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json web/results.json data/archive.json data/history
          if git diff --staged --quiet; then
            echo "results.json unchanged"
          else
            git commit -m "Update the daily domain list."
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
